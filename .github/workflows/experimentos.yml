name: experimentos

# Se lanza a mano desde la pestaña Actions -> experimentos -> Run workflow
on:
  workflow_dispatch:

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  # Una máquina por instancia: los 10 seeds de los 6 algoritmos aleatorios + PD, voraz, BL, OR-Tools
  principal:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        inst:
          - knapPI_1_100_1000_1
          - knapPI_1_200_1000_1
          - knapPI_1_500_1000_1
          - knapPI_1_1000_1000_1
          - knapPI_1_2000_1000_1
          - knapPI_1_5000_1000_1
          - knapPI_1_10000_1000_1
          - knapPI_2_100_1000_1
          - knapPI_2_200_1000_1
          - knapPI_2_500_1000_1
          - knapPI_2_1000_1000_1
          - knapPI_2_2000_1000_1
          - knapPI_11_10000_1000_1
          - knapPI_11_10000_1000_2
          - knapPI_12_10000_1000_1
          - knapPI_12_10000_1000_2
          - knapPI_13_10000_1000_1
          - knapPI_13_10000_1000_2
          - knapPI_14_10000_1000_1
          - knapPI_14_10000_1000_2
          - knapPI_15_10000_1000_1
          - knapPI_15_10000_1000_2
          - knapPI_16_10000_1000_1
          - knapPI_16_10000_1000_2
          - gen_1_10000_100000
          - gen_1_25000_100000
          - gen_1_50000_100000
          - gen_1_100000_100000
          - gen_2_10000_100000
          - gen_2_25000_100000
          - gen_2_50000_100000
          - gen_2_100000_100000
          - gen_3_10000_100000
          - gen_3_25000_100000
          - gen_3_50000_100000
          - gen_3_100000_100000
          - gen_5_10000_100000
          - gen_5_25000_100000
          - gen_5_50000_100000
          - gen_5_100000_100000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python experimentos2.py principal 1 "${{ matrix.inst }}"
      - uses: actions/upload-artifact@v4
        with:
          name: principal-${{ matrix.inst }}
          path: res/principal/

  # Estudio de parámetros sobre el subconjunto de 6 instancias
  parametros:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        inst:
          - knapPI_1_10000_1000_1
          - knapPI_2_2000_1000_1
          - knapPI_14_10000_1000_1
          - knapPI_16_10000_1000_1
          - gen_3_10000_100000
          - gen_5_10000_100000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python experimentos2.py parametros 1 "${{ matrix.inst }}"
      - uses: actions/upload-artifact@v4
        with:
          name: parametros-${{ matrix.inst }}
          path: res/parametros/

  # Une todo, arma las tablas LaTeX y deja un solo artifact para descargar
  tablas:
    needs: [principal, parametros]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: principal-*
          path: res/principal
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: parametros-*
          path: res/parametros
          merge-multiple: true
      - name: Unir CSV
        run: |
          python experimentos2.py principal 1 NINGUNA
          python experimentos2.py parametros 1 NINGUNA
      - run: python tablas_e2.py
      - uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: |
            resultados2.csv
            parametros2.csv
            tablas/
            cifras.json
            res/
